[build]
  publish = "."

# Custom headers for security, performance, and SEO
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static images and assets for max performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Clean URL redirection
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
